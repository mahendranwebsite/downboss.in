version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: downboss-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - backend-temp:/app/temp_downloads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: downboss-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  backend-temp:
